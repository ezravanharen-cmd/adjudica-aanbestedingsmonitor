.meta-r{display:grid;gap:6px;justify-items:end;align-content:start;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}

@media (max-width:720px){
  .menubar{position:relative}
  .dd{position:static}
  .dd-menu{left:0;right:0;min-width:0;max-width:none}

const LANDEN = {BEL:"BE",NLD:"NL",LUX:"LU",FRA:"FR"};
const store = {
  get(k,d){try{const v=localStorage.getItem("am:"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("am:"+k,JSON.stringify(v))}catch(e){}}
};
const state = {luik: store.get("luik","documenten"), land:new Set(), profiel:new Set(), toon:60, taal: store.get("taal","nl"),
  fav: {}};
try{ for (const id of store.get("bewaard",[])) state.fav[id]=null; }catch(e){}
let DATA = null;
const t = k => T[state.taal][k];

/* Favorieten: per persoon bewaard in de artifact-database (synchroon over toestellen);
   zonder database (lokaal bestand) valt het terug op deze browser. */
let favDoc = null, favBezig = Promise.resolve();
function slimItem(it){ const c={...it}; if(c.beschrijving) c.beschrijving=c.beschrijving.slice(0,300); delete c.sectoren_tmp; return c; }
function bewaarFav(){
  const body={items:{}}; for (const [id,it] of Object.entries(state.fav)) body.items[id]=it||{id};
  try{ store.set("bewaard", Object.keys(state.fav)); }catch(e){}
  if (!favDoc) return;
  favBezig = favBezig.then(()=>favDoc.set(body)).catch(e=>console.warn("favorieten opslaan mislukt", e && e.code));
}
async function startFavDb(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user && await user.id();
    if (!db || !uid) return;
    favDoc = db.doc("data/users/"+uid+"/favorieten");
    let eerste = true;
    favDoc.onSnapshot(snap=>{
      const remote = snap.exists ? (snap.data().items||{}) : {};
      if (eerste) {
        eerste = false;
        const lokaal = Object.keys(state.fav).filter(id=>!(id in remote));
        state.fav = {...remote};
        // eenmalig lokale favorieten (van voor de database) meenemen
        if (lokaal.length && DATA){ for (const id of lokaal){ const it=alleItems().find(x=>x.id===id); if(it) state.fav[id]=slimItem(it);} bewaarFav(); }
      } else state.fav = {...remote};
      if (DATA) render();
    }, e=>console.warn("favorieten niet beschikbaar", e && e.code));
  }catch(e){ console.warn(e); }
}
function toggleFav(id){
  if (id in state.fav) delete state.fav[id];
  else { const it=alleItems().find(x=>x.id===id) || (state.fav[id]); state.fav[id]= it ? slimItem(it) : {id}; }
  bewaarFav(); render();
}

async function laad(){
  if (INGEBED) return INGEBED;
  try{const r = await fetch("data.json",{cache:"no-store"}); if(r.ok) return await r.json();}catch(e){}
  return voorbeeld;
}

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vandaag = new Date(); vandaag.setHours(0,0,0,0);
const locale = () => state.taal==="fr" ? "fr-BE" : "nl-BE";
function dagenTot(d){ if(!d) return null; const x=new Date(d+"T00:00:00"); return Math.round((x-vandaag)/864e5); }
function fmtDatum(d){ if(!d) return "—"; const [y,m,dd]=d.split("-"); return `${dd}.${m}.${y}`; }
function fmtWaarde(v,m){ if(v==null) return ""; return new Intl.NumberFormat(locale(),{maximumFractionDigits:0}).format(v)+" "+(m||"EUR"); }
const isNieuw = it => DATA.run && it.eerst_gezien === DATA.run.tijdstip;
const profielNaam = id => t("profielen")[id] || (DATA.profielen.find(p=>p.id===id)||{}).naam || id;
const luikNaam = l => t("luiken")[l.id] || l.naam || l.id;
const luikVan = id => (DATA.profielen.find(p=>p.id===id)||{}).luik;
function inLuik(it, luik){ return Object.keys(it.profielen||{}).some(p=>luikVan(p)===luik); }
function waarom(w){
  if(!w) return "";
  if(w.startsWith("CPV ")) return w;
  const m=w.match(/^trefwoord '(.*)'$/); if(m) return `${t("waarom").trefwoord} « ${m[1]} »`;
  if(w==="levering zonder raamovereenkomst") return t("waarom").levering;
  return w;
}
function redenTekst(it){
  if(!it.niet_gegund) return "";
  const r=t("reden")[it.reden_code];
  if(r && it.bron==="TED") return r + ((it.reden_niet_gegund||"").includes("enkele percelen")?t("deels"):"");
  return it.reden_niet_gegund || t("nietGegund");
}

function vertaalStatisch(){
  document.documentElement.lang = state.taal;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(e=>{e.placeholder=t(e.dataset.i18nPh); e.setAttribute("aria-label",t(e.dataset.i18nPh));});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===state.taal));
}

function renderStatus(){
  const s=document.getElementById("status"); const run=DATA.run||{};
  const tijd = run.tijdstip ? new Date(run.tijdstip) : null;
  let h = tijd ? `${t("bijgewerkt")} ${tijd.toLocaleDateString(locale(),{weekday:"short",day:"numeric",month:"short"})} ${tijd.toLocaleTimeString(locale(),{hour:"2-digit",minute:"2-digit"})}` : "";
  const namen={ted:"TED",tenderned:"TenderNed",boamp:"BOAMP",pmp_lu:"pmp.lu"};
  for (const [k,v] of Object.entries(run.bronnen||{})) h += ` <span class="src ${v.ok?"ok":"fail"}" title="${esc(v.ok?t("opgehaald")(v.aantal):v.fout)}">${namen[k]||k}</span>`;
  s.innerHTML = h;
  const note=document.getElementById("note");
  note.hidden=true;
  if (DATA.voorbeeld){ note.hidden=false; note.textContent=t("voorbeeld"); }
  else { const f=Object.entries(run.bronnen||{}).filter(([k,v])=>!v.ok); if(f.length){note.hidden=false; note.textContent=t("bronFout")(f.map(([k])=>namen[k]||k).join(", "));} }
}

const isCU = () => state.luik.startsWith("cu:");
const cuLijsten = () => (DATA && DATA.coming_up) || [];
const cuHuidig = () => cuLijsten().find(l=>"cu:"+l.id===state.luik);
function alleItems(){ return DATA.items.concat(...cuLijsten().map(l=>l.items)); }
function cuEind(it){ const nu=vandaagIso(); return (it.einddatum && it.einddatum>=nu) ? it.einddatum : (it.einddatum_max || it.einddatum || ""); }
function vandaagIso(){ const y=vandaag.getFullYear(), m=String(vandaag.getMonth()+1).padStart(2,"0"), d=String(vandaag.getDate()).padStart(2,"0"); return `${y}-${m}-${d}`; }

let openMenu = null;
function sluitMenus(){ openMenu=null; document.querySelectorAll(".dd-menu").forEach(m=>m.hidden=true);
  document.querySelectorAll(".dd > .mb-knop").forEach(b=>b.setAttribute("aria-expanded","false")); }
function kies(luik){ state.luik=luik; state.profiel.clear(); state.toon=60; store.set("luik",luik);
  document.getElementById("open").checked = luik!=="niet_gegund" && luik!=="favorieten"; sluitMenus(); render(); }

function renderTabs(){
  const nav=document.getElementById("menubar");
  const catItems = DATA.luiken.map(l=>{
    const items = DATA.items.filter(it=>!it.dubbel_van && inLuik(it,l.id));
    const n = items.filter(isNieuw).length;
    return {luik:l.id, naam:luikNaam(l), count:n?("+"+n):items.length, nieuw:n};
  });
  const huidigCat = catItems.find(c=>c.luik===state.luik);
  const cu = cuLijsten(), huidigCU = cuHuidig();
  const dd = (key, label, huidig, opties) => `<div class="dd">
      <button type="button" class="mb-knop" data-menu="${key}" aria-haspopup="true" aria-expanded="${openMenu===key}" aria-current="${!!huidig}">
        ${esc(label)}${huidig?`<span class="sub">· ${esc(huidig.naam)}</span>`:""}<span class="pijl" aria-hidden="true">▼</span></button>
      <div class="dd-menu" data-for="${key}" role="menu" ${openMenu===key?"":"hidden"}>
        ${opties.map(o=>`<button type="button" role="menuitemradio" aria-checked="${state.luik===o.luik}" data-luik="${o.luik}">
          <span>${esc(o.naam)}${o.sub?`<small>${esc(o.sub)}</small>`:""}</span><span class="count ${o.nieuw?"n":""}">${o.count}</span></button>`).join("")}
      </div></div>`;
  nav.innerHTML =
    `<button type="button" class="mb-knop" data-luik="favorieten" aria-current="${state.luik==="favorieten"}">★ ${esc(t("favorieten"))} <span class="count">${favLijst().length}</span></button>`
    + dd("cat", t("categorieen"), huidigCat, catItems)
    + (cu.length ? dd("cu", t("comingUp"), huidigCU && {naam:huidigCU.naam}, cu.map(l=>({luik:"cu:"+l.id,naam:l.naam,sub:t("cuSub")(l.maanden||12),count:l.items.length}))) : "");
  nav.querySelectorAll("[data-luik]").forEach(b=>b.onclick=()=>kies(b.dataset.luik));
  nav.querySelectorAll("[data-menu]").forEach(b=>b.onclick=e=>{e.stopPropagation(); const k=b.dataset.menu;
    const was=openMenu===k; sluitMenus(); if(!was){ openMenu=k; nav.querySelector(`[data-for="${k}"]`).hidden=false; b.setAttribute("aria-expanded","true");
      const eerste=nav.querySelector(`[data-for="${k}"] button`); if(eerste) eerste.focus(); }});
}
document.addEventListener("click",e=>{ if(openMenu && !e.target.closest(".dd")) sluitMenus(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && openMenu){ const k=openMenu; sluitMenus(); const b=document.querySelector(`[data-menu="${k}"]`); if(b) b.focus(); }});

function renderChips(){
  const lc=document.getElementById("landen");
  lc.innerHTML = Object.entries(LANDEN).map(([k,v])=>`<button type="button" class="chip" data-land="${k}" aria-pressed="${state.land.has(k)}">${v}</button>`).join("");
  lc.querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=b.dataset.land; state.land.has(k)?state.land.delete(k):state.land.add(k); render();});
  const pc=document.getElementById("profielen");
  const profs = state.luik==="niet_gegund"
    ? DATA.profielen.filter(p=>p.luik==="documenten"||p.luik==="it").map(p=>({id:p.id,naam:t("sector")+": "+profielNaam(p.id)}))
    : (state.luik==="favorieten" || isCU()) ? []
    : DATA.profielen.filter(p=>p.luik===state.luik).map(p=>({id:p.id,naam:profielNaam(p.id)}));
  pc.innerHTML = profs.length>1 ? profs.map(p=>`<button type="button" class="chip" data-p="${p.id}" aria-pressed="${state.profiel.has(p.id)}">${esc(p.naam)}</button>`).join("") : "";
  pc.querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=b.dataset.p; state.profiel.has(k)?state.profiel.delete(k):state.profiel.add(k); render();});
}

function favLijst(){
  return Object.entries(state.fav).map(([id,it])=>alleItems().find(x=>x.id===id) || (it && it.titel ? it : null)).filter(Boolean);
}
function gefilterd(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const alleenNieuw=document.getElementById("nieuw").checked, open=document.getElementById("open").checked;
  if (isCU()) {
    let r = (cuHuidig()||{items:[]}).items.slice();
    if (state.land.size) r=r.filter(it=>state.land.has(it.land));
    if (q) r=r.filter(it=>[it.titel,it.koper,it.leverancier,(it.cpv||[]).join(" ")].join(" ").toLowerCase().includes(q));
    if (document.getElementById("sort").value==="waarde") r.sort((a,b)=>(b.waarde||0)-(a.waarde||0));
    else r.sort((a,b)=>(a.soort==="vooraankondiging")-(b.soort==="vooraankondiging") || (cuEind(a)||"9999").localeCompare(cuEind(b)||"9999"));
    return r;
  }
  let r = state.luik==="favorieten" ? favLijst() : DATA.items.filter(it=>!it.dubbel_van && inLuik(it,state.luik));
  if (state.profiel.size) r=r.filter(it=>Object.keys(it.profielen).concat(it.sectoren||[]).some(p=>state.profiel.has(p)));
  if (state.land.size) r=r.filter(it=>state.land.has(it.land));
  if (alleenNieuw) r=r.filter(isNieuw);
  if (open && state.luik!=="niet_gegund" && state.luik!=="favorieten") r=r.filter(it=>{const d=dagenTot(it.deadline); return d===null||d>=0;});
  if (q) r=r.filter(it=>[it.titel,it.koper,it.beschrijving,(it.cpv||[]).join(" "),it.bron].join(" ").toLowerCase().includes(q));
  const s=document.getElementById("sort").value;
  if (state.luik==="niet_gegund" && s==="pub") r.sort((a,b)=>(a.reden_code==="no-rece"?0:1)-(b.reden_code==="no-rece"?0:1) || (b.gepubliceerd||"").localeCompare(a.gepubliceerd||""));
  else if (s==="deadline") r.sort((a,b)=>(a.deadline||"9999").localeCompare(b.deadline||"9999"));
  else if (s==="waarde") r.sort((a,b)=>(b.waarde||0)-(a.waarde||0));
  else r.sort((a,b)=>(b.gepubliceerd||"").localeCompare(a.gepubliceerd||""));
  return r;
}

function maandenTot(d){ if(!d) return null; const x=new Date(d+"T00:00:00"); return (x.getFullYear()-vandaag.getFullYear())*12 + x.getMonth()-vandaag.getMonth(); }
function maandLabel(d){ const x=new Date(d+"T00:00:00"); return x.toLocaleDateString(locale(),{month:"long",year:"numeric"}); }
function rijCU(it){
  const eind=cuEind(it), m=maandenTot(eind);
  let rechts = it.soort==="vooraankondiging" ? `<span class="pill warn">${t("vooraankondiging")}</span>`
    : eind ? `<span class="pill ${m<=3?"crit":m<=6?"warn":"ok"}">${t("over")(m)}</span><span>${fmtDatum(eind)}${it.geschat?` <i>(${t("geschat")})</i>`:""}</span>` : "";
  if (it.waarde) rechts+=`<span class="value">${fmtWaarde(it.waarde,"EUR")}</span>`;
  const regels = [];
  if (it.leverancier) regels.push(`<span class="tag wie">${t("leverancier")}: <b>${esc(it.leverancier)}</b></span>`);
  if (it.einddatum && it.einddatum_max && it.einddatum_max!==eind) regels.push(`<span class="tag">${t("looptAf")} ${fmtDatum(it.einddatum)}, ${t("verlengdTot")} ${fmtDatum(it.einddatum_max)}</span>`);
  else if (it.verlenging) regels.push(`<span class="tag" title="${esc(it.verlenging)}">${esc(it.verlenging.slice(0,80))}</span>`);
  return `<li class="item" data-id="${esc(it.id)}">
    <div class="meta-l"><span class="flag">${LANDEN[it.land]||esc(it.land)}</span><span>${it.soort==="vooraankondiging"?t("aangekondigd"):t("gegund")}</span><span>${fmtDatum(it.gepubliceerd)}</span><span>${esc(it.bron)}</span></div>
    <div class="body">
      <a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.titel||t("zonderTitel"))}</a>
      <div class="buyer">${esc(it.koper)}</div>
      ${regels.length?`<div class="tags">${regels.join("")}</div>`:""}
      ${(it.cpv||[]).length?`<div class="cpv">CPV ${it.cpv.slice(0,6).map(esc).join(" · ")}</div>`:""}
    </div>
    <div class="meta-r">${rechts}
      <div class="actions"><button type="button" data-act="fav" aria-pressed="${it.id in state.fav}"><span class="ster" aria-hidden="true">${it.id in state.fav?"★":"☆"}</span>${t("favoriet")}</button></div>
    </div></li>`;
}
function rij(it){
  if (it.lijst) return rijCU(it);
  const d=dagenTot(it.deadline);
  let rechts="";
  if (it.niet_gegund) rechts=`<span class="pill ${it.reden_code==="no-rece"?"crit":"warn"}">${it.reden_code==="no-rece"?t("geenKandidaten"):t("nietGegund")}</span>`;
  else if (d!==null) rechts=`<span class="pill ${d<0?"":d<=7?"crit":d<=14?"warn":"ok"}">${d<0?t("verstreken"):d===0?t("vandaag"):t("dagen")(d)}</span><span>${fmtDatum(it.deadline)}</span>`;
  else rechts=`<span class="pill">${t("geenDeadline")}</span>`;
  if (it.waarde) rechts+=`<span class="value">${fmtWaarde(it.waarde,it.munt)}</span>`;
  const tags = Object.entries(it.profielen||{}).filter(([p])=>!(it.niet_gegund&&p==="niet_gegund")).map(([p,why])=>`<span class="tag" title="${esc(waarom(why))}">${esc(profielNaam(p))} <i>· ${esc(waarom(why))}</i></span>`).join("")
    + (it.sectoren||[]).map(p=>`<span class="tag">${t("sector")}: ${esc(profielNaam(p))}</span>`).join("");
  const reden = it.niet_gegund ? `<div class="buyer">${esc(redenTekst(it))}${it.aantal_offertes!=null?` · ${t("offertes")(it.aantal_offertes)}`:""}</div>`:"";
  return `<li class="item" data-id="${esc(it.id)}">
    <div class="meta-l"><span class="flag">${LANDEN[it.land]||esc(it.land)}</span><span>${fmtDatum(it.gepubliceerd)}</span><span>${esc(it.bron)}</span></div>
    <div class="body">
      <a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.titel||t("zonderTitel"))}</a>
      <div class="buyer">${esc(it.koper)}${it.aard?" · "+(t("aard")[it.aard]||esc(it.aard)):""}${it.procedure?" · "+esc(it.procedure):""}</div>
      ${reden}
      ${it.beschrijving?`<div class="desc">${esc(it.beschrijving)}</div>`:""}
      <div class="tags">${isNieuw(it)?`<span class="tag new">${t("nieuw")}</span>`:""}${tags}</div>
      ${(it.cpv||[]).length?`<div class="cpv">CPV ${it.cpv.slice(0,6).map(esc).join(" · ")}</div>`:""}
    </div>
    <div class="meta-r">${rechts}
      <div class="actions"><button type="button" data-act="fav" aria-pressed="${it.id in state.fav}"><span class="ster" aria-hidden="true">${it.id in state.fav?"★":"☆"}</span>${t("favoriet")}</button></div>
    </div></li>`;
}

function render(){
  vertaalStatisch(); renderStatus(); renderTabs(); renderChips();
  const r=gefilterd();
  const list=document.getElementById("list");
  const cu=isCU();
  document.getElementById("togNieuw").hidden = cu;
  document.getElementById("togOpen").hidden = cu || state.luik==="favorieten" || state.luik==="niet_gegund";
  document.getElementById("filters2").hidden = cu;
  const so=document.getElementById("sort");
  so.querySelector('[value="pub"]').textContent = cu ? t("looptAf") : t("sortPub");
  so.querySelector('[value="deadline"]').hidden = cu;
  if (cu && so.value==="deadline") so.value="pub";
  const intro=document.getElementById("cuIntro"); intro.hidden=!cu; if(cu) intro.textContent=t("cuIntro")((cuHuidig()||{}).maanden||12);
  let html = "", vorige = null;
  for (const it of r.slice(0,state.toon)) {
    if (cu && so.value==="pub") {
      const key = it.soort==="vooraankondiging" || !cuEind(it) ? t("vooraankondiging") : maandLabel(cuEind(it));
      if (key!==vorige){ html += `<li class="maand">${esc(key)}</li>`; vorige=key; }
    }
    html += rij(it);
  }
  list.innerHTML = r.length ? html : `<li class="empty">${state.luik==="favorieten"?t("favLeeg"):cu?t("cuLeeg"):t("leeg")}</li>`;
  document.getElementById("summary").textContent = t("publicaties")(r.length)+(r.length>state.toon?` · ${t("getoond")(state.toon)}`:"");
  document.getElementById("more").hidden = r.length<=state.toon;
}

document.getElementById("list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]"); if(!b) return;
  toggleFav(b.closest("li").dataset.id);
});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{state.taal=b.dataset.lang; store.set("taal",state.taal); if(DATA) render(); else vertaalStatisch();});
document.getElementById("moreBtn").onclick=()=>{state.toon+=60; render();};
["q","sort","nieuw","open"].forEach(id=>document.getElementById(id).addEventListener("input",()=>{state.toon=60; render();}));

if(!T[state.taal]) state.taal="nl";
vertaalStatisch();
laad().then(d=>{DATA=d; DATA.coming_up=DATA.coming_up||[]; if(state.luik!=="favorieten" && !DATA.luiken.some(l=>l.id===state.luik) && !DATA.coming_up.some(l=>"cu:"+l.id===state.luik)) state.luik=DATA.luiken[0].id;
  // favorieten van vóór de database: vul met de volledige gegevens
  for (const id of Object.keys(state.fav)) if(!state.fav[id]){ const it=alleItems().find(x=>x.id===id); if(it) state.fav[id]=slimItem(it); else delete state.fav[id]; }
  document.getElementById("open").checked = state.luik!=="niet_gegund" && state.luik!=="favorieten"; render(); startFavDb();});
</script>
